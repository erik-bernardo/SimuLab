<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>termo</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #c35515;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      background-color: #ffffff;
      width: 100%;
      max-width: 900px;
      padding: 40px;
      box-sizing: border-box;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }
    
    /* Moldura preta do jogo com proporção e encaixe perfeito */
    .screen-area {
      position: relative;
      width: 100%;
      height: 480px; /* Altura fixa garantida para o jogo */
      background-color: #000000;
      margin-bottom: 30px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    /* Configuração para o iframe preencher 100% do espaço */
    .screen-area iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    
    .fullscreen-btn {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background-color: rgba(0, 0, 0, 0.5);
      border: 1px solid #666;
      border-radius: 4px;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .fullscreen-btn:hover {
      background-color: rgba(255, 255, 255, 0.3);
    }
    
    h1 {
      font-size: 42px;
      font-weight: bold;
      margin: 0 0 15px 0;
      color: #000000;
    }
    p {
      font-size: 18px;
      line-height: 1.5;
      color: #000000;
      margin: 0;
      white-space: pre-line;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="screen-area" id="gameContainer">
      <iframe id="gameFrame" src="https://term.ooo/" allowfullscreen></iframe>
      <button class="fullscreen-btn" onclick="toggleFullscreen()" title="Tela Cheia">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
        </svg>
      </button>
    </div>

    <h1>termo</h1>
    <p>bla bla bla bla</p>
  </div>

  <script>
    function toggleFullscreen() {
      const container = document.getElementById('gameContainer');
      if (container.requestFullscreen) {
        container.requestFullscreen();
      } else if (container.webkitRequestFullscreen) {
        container.webkitRequestFullscreen();
      }
    }
  </script>
</body>
</html>
